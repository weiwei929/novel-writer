<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版本管理API测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; }
        .button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        .error { background: #ffe6e6; color: #d00; }
        .success { background: #e6ffe6; color: #060; }
        input, textarea { padding: 5px; margin: 5px; }
        input[type="text"] { width: 200px; }
        textarea { width: 400px; height: 100px; }
    </style>
</head>
<body>
    <h1>版本管理 API 测试工具</h1>
    
    <div class="section">
        <h3>测试配置</h3>
        <label>API 基础地址: </label>
        <input type="text" id="apiBase" value="http://localhost:3001/api" />
        <br>
        <label>项目 ID: </label>
        <input type="text" id="projectId" value="test-project-id" />
        <br>
        <label>版本 ID: </label>
        <input type="text" id="versionId" value="" />
    </div>

    <div class="section">
        <h3>1. 创建版本</h3>
        <label>版本类型: </label>
        <select id="versionType">
            <option value="manual">手动保存</option>
            <option value="auto">自动保存</option>
            <option value="milestone">里程碑</option>
            <option value="snapshot">快照</option>
        </select>
        <br>
        <label>标题: </label>
        <input type="text" id="versionTitle" value="测试版本" />
        <br>
        <label>描述: </label>
        <textarea id="versionDescription">这是一个测试版本</textarea>
        <br>
        <button class="button" onclick="createVersion()">创建版本</button>
        <div id="createResult" class="result"></div>
    </div>

    <div class="section">
        <h3>2. 获取版本列表</h3>
        <label>页数: </label>
        <input type="number" id="page" value="1" />
        <label>每页数量: </label>
        <input type="number" id="limit" value="10" />
        <br>
        <button class="button" onclick="getVersions()">获取版本列表</button>
        <div id="versionsResult" class="result"></div>
    </div>

    <div class="section">
        <h3>3. 获取版本详情</h3>
        <button class="button" onclick="getVersionDetail()">获取版本详情</button>
        <div id="detailResult" class="result"></div>
    </div>

    <div class="section">
        <h3>4. 自动保存</h3>
        <button class="button" onclick="autoSave()">触发自动保存</button>
        <div id="autoSaveResult" class="result"></div>
    </div>

    <div class="section">
        <h3>5. 版本统计</h3>
        <button class="button" onclick="getStats()">获取版本统计</button>
        <div id="statsResult" class="result"></div>
    </div>

    <script>
                const API_BASE = 'http://localhost:5000/api/versions';
        const projectId = () => document.getElementById('projectId').value;
        const versionId = () => document.getElementById('versionId').value;

        function showResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(data, null, 2);
            element.className = isError ? 'result error' : 'result success';
        }

        async function apiCall(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                const data = await response.json();
                return { data, status: response.status };
            } catch (error) {
                return { error: error.message, status: 500 };
            }
        }

        async function createVersion() {
            const requestData = {
                type: document.getElementById('versionType').value,
                title: document.getElementById('versionTitle').value,
                description: document.getElementById('versionDescription').value,
                tags: ['test', 'api']
            };

            const result = await apiCall(
                `${apiBase()}/projects/${projectId()}/versions`,
                {
                    method: 'POST',
                    body: JSON.stringify(requestData)
                }
            );

            if (result.error) {
                showResult('createResult', { error: result.error }, true);
            } else {
                showResult('createResult', result.data);
                // 自动填充版本ID供后续测试使用
                if (result.data.success && result.data.data) {
                    document.getElementById('versionId').value = result.data.data.id;
                }
            }
        }

        async function getVersions() {
            const page = document.getElementById('page').value;
            const limit = document.getElementById('limit').value;
            
            const result = await apiCall(
                `${apiBase()}/projects/${projectId()}/versions?page=${page}&limit=${limit}`
            );

            if (result.error) {
                showResult('versionsResult', { error: result.error }, true);
            } else {
                showResult('versionsResult', result.data);
                // 如果有版本，自动填充第一个版本的ID
                if (result.data.success && result.data.data && result.data.data.length > 0) {
                    document.getElementById('versionId').value = result.data.data[0].id;
                }
            }
        }

        async function getVersionDetail() {
            const vId = versionId();
            if (!vId) {
                showResult('detailResult', { error: '请先填写版本ID' }, true);
                return;
            }

            const result = await apiCall(
                `${apiBase()}/projects/${projectId()}/versions/${vId}`
            );

            if (result.error) {
                showResult('detailResult', { error: result.error }, true);
            } else {
                showResult('detailResult', result.data);
            }
        }

        async function autoSave() {
            const result = await apiCall(
                `${apiBase()}/projects/${projectId()}/versions/auto-save`,
                { method: 'POST' }
            );

            if (result.error) {
                showResult('autoSaveResult', { error: result.error }, true);
            } else {
                showResult('autoSaveResult', result.data);
                // 自动填充新创建的版本ID
                if (result.data.success && result.data.data) {
                    document.getElementById('versionId').value = result.data.data.id;
                }
            }
        }

        async function getStats() {
            const result = await apiCall(
                `${apiBase()}/projects/${projectId()}/versions/stats`
            );

            if (result.error) {
                showResult('statsResult', { error: result.error }, true);
            } else {
                showResult('statsResult', result.data);
            }
        }

        // 页面加载时的初始化
        window.onload = function() {
            console.log('版本管理API测试工具已加载');
            console.log('使用说明：');
            console.log('1. 确保后端服务运行在 http://localhost:3001');
            console.log('2. 修改项目ID为实际存在的项目');
            console.log('3. 按顺序测试各个API功能');
        };
    </script>
</body>
</html>
